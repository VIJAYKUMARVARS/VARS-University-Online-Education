<!DOCTYPE html>
<html>
<head>
<title>VARS UNIVERSITY DIGITAL CAMPUS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

body{
overflow:hidden;
background:#020a08;
}

/* Animated Gradient Background */
body{
background:linear-gradient(-45deg,#02140f,#032f24,#02140f,#043528);
background-size:400% 400%;
animation:bgMove 18s ease infinite;
}

/* Watermark Logo */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("logo.png") no-repeat center center;
background-size:800px;
opacity:.025;
z-index:0;
}

/* Login Frame */
#loginFrame{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
z-index:1;
}

/* Splash Screen Glass Layer */
#logoSplash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
backdrop-filter:blur(8px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
transition:opacity 2s ease;
}

/* Logo Cinematic Glow */
#logoSplash img{
width:180px;
animation:logoEnter 3s ease;
filter:drop-shadow(0 0 40px rgba(0,255,180,.6));
}

/* Text */
.splashText{
color:#eafffa;
margin-top:25px;
letter-spacing:6px;
font-size:20px;
opacity:0;
animation:textFade 2s ease 2.5s forwards;
}

/* Ultra Loader Ring */
.loader{
width:80px;
height:80px;
border-radius:50%;
border:3px solid rgba(255,255,255,.1);
border-top:3px solid #00ffb3;
animation:spin 1.2s linear infinite;
margin-top:35px;
}

/* AI Particle Field */
.particle{
position:absolute;
width:3px;
height:3px;
background:#00ffb3;
border-radius:50%;
opacity:.7;
animation:float 7s infinite ease-in-out;
}

/* Neon Pulse Overlay */
.neonPulse{
position:absolute;
width:300px;
height:300px;
background:radial-gradient(circle,#00ffb3 0%, transparent 70%);
opacity:.15;
animation:pulse 4s infinite;
}

/* Animations */
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

@keyframes logoEnter{
0%{opacity:0; transform:scale(.4) rotate(-25deg);}
60%{opacity:1; transform:scale(1.15) rotate(5deg);}
100%{transform:scale(1) rotate(0);}
}

@keyframes textFade{
to{opacity:1;}
}

@keyframes spin{
to{transform:rotate(360deg);}
}

@keyframes float{
0%{transform:translateY(0px)}
50%{transform:translateY(-40px)}
100%{transform:translateY(0px)}
}

@keyframes pulse{
0%{transform:scale(1); opacity:.1;}
50%{transform:scale(1.4); opacity:.2;}
100%{transform:scale(1); opacity:.1;}
}
</style>

</head>

<body>

<!-- Background Login -->
<iframe id="loginFrame" src="Final_LMS_DashboardFixed_Full.html"></iframe>

<!-- Cinematic Splash -->
<div id="logoSplash">

<div class="neonPulse"></div>

<img src="logo.png">

<div class="splashText">VARS UNIVERSITY AI DIGITAL CAMPUS</div>

<div class="loader"></div>

</div>

<!-- Particle Field -->
<div class="particle" style="top:20%;left:15%"></div>
<div class="particle" style="top:70%;left:25%;animation-delay:2s"></div>
<div class="particle" style="top:40%;left:80%;animation-delay:3s"></div>
<div class="particle" style="top:80%;left:60%;animation-delay:1s"></div>
<div class="particle" style="top:10%;left:50%;animation-delay:4s"></div>

<script>
setTimeout(()=>{
document.getElementById("logoSplash").style.opacity="0";
setTimeout(()=>{
document.getElementById("logoSplash").style.display="none";
},2000);
},6500);
</script>

</body>
</html>
