<!DOCTYPE html>
<html>
<head>
<title>VARS UNIVERSITY</title>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
overflow:hidden;
background:#0b1f17;
}

/* Watermark Background */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("logo.png") no-repeat center center;
background-size:700px;
opacity:0.04;
z-index:0;
filter:blur(1px);
}

/* Login Frame */
#loginFrame{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
z-index:1;
}

/* Premium Splash Screen */
#logoSplash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#02140f,#0d3a2c);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
transition:opacity 1.5s ease;
}

/* Logo Animation */
#logoSplash img{
width:220px;
animation:logoIntro 2.5s ease;
filter:drop-shadow(0 0 25px rgba(0,255,170,.4));
}

/* University Text */
.splashText{
color:white;
margin-top:20px;
letter-spacing:4px;
font-size:20px;
opacity:0;
animation:textFade 2s ease 1.5s forwards;
}

/* Loader Bar */
.loader{
width:200px;
height:4px;
background:rgba(255,255,255,.15);
margin-top:30px;
overflow:hidden;
border-radius:5px;
}

.loader span{
display:block;
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffa6,#00c27a);
animation:loading 4s linear forwards;
}

/* Animations */
@keyframes logoIntro{
0%{opacity:0; transform:scale(.6) rotate(-10deg);}
60%{opacity:1; transform:scale(1.1) rotate(3deg);}
100%{transform:scale(1) rotate(0);}
}

@keyframes textFade{
to{opacity:1;}
}

@keyframes loading{
to{width:100%;}
}
</style>

</head>

<body>

<!-- Login Page Background Load -->
<iframe id="loginFrame" src="https://vijaykumarvars.github.io/VARS-University-Online-Education/Final_LMS_DashboardFixed_Full.html"></iframe>

<!-- Premium Splash -->
<div id="logoSplash">

<img src="logo.png">

<div class="splashText">VARS UNIVERSITY LMS</div>

<div class="loader">
<span></span>
</div>

</div>

<script>
setTimeout(()=>{
document.getElementById("logoSplash").style.opacity="0";
setTimeout(()=>{
document.getElementById("logoSplash").style.display="none";
},1500);
},5000);
</script>

</body>
</html>
