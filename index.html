<!DOCTYPE html>
<html>
<head>
<title>VARS UNIVERSITY LMS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

body{
overflow:hidden;
background:#02140f;
}

/* Animated Gradient Background */
body{
background: linear-gradient(-45deg,#02140f,#063d2d,#02140f,#0b3d2c);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
}

/* Watermark Logo */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("logo.png") no-repeat center center;
background-size:750px;
opacity:0.03;
z-index:0;
}

/* Background Login */
#loginFrame{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
z-index:1;
}

/* Splash Screen */
#logoSplash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
backdrop-filter:blur(6px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
transition:opacity 1.5s ease;
}

/* Logo Animation */
#logoSplash img{
width:200px;
animation:logoCinematic 3s ease;
filter:drop-shadow(0 0 35px rgba(0,255,170,.5));
}

/* University Text */
.splashText{
color:white;
margin-top:25px;
letter-spacing:5px;
font-size:22px;
opacity:0;
animation:textFade 2s ease 2s forwards;
}

/* Loader Ring */
.loaderRing{
width:70px;
height:70px;
border:3px solid rgba(255,255,255,.1);
border-top:3px solid #00ffb3;
border-radius:50%;
margin-top:30px;
animation:spin 1s linear infinite;
}

/* Floating Glow Particles */
.particle{
position:absolute;
width:4px;
height:4px;
background:#00ffb3;
border-radius:50%;
opacity:.6;
animation:float 6s infinite ease-in-out;
}

/* Animations */
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

@keyframes logoCinematic{
0%{opacity:0; transform:scale(.5) rotate(-20deg);}
50%{opacity:1; transform:scale(1.1) rotate(3deg);}
100%{transform:scale(1) rotate(0);}
}

@keyframes textFade{
to{opacity:1;}
}

@keyframes spin{
to{transform:rotate(360deg);}
}

@keyframes float{
0%{transform:translateY(0px)}
50%{transform:translateY(-30px)}
100%{transform:translateY(0px)}
}
</style>

</head>

<body>

<!-- Login Page Background -->
<iframe id="loginFrame" src="Final_LMS_DashboardFixed_Full.html"></iframe>

<!-- Splash Screen -->
<div id="logoSplash">

<img src="logo.png">

<div class="splashText">VARS UNIVERSITY DIGITAL CAMPUS</div>

<div class="loaderRing"></div>

</div>

<!-- Particles -->
<div class="particle" style="top:20%;left:15%;"></div>
<div class="particle" style="top:70%;left:25%;animation-delay:2s"></div>
<div class="particle" style="top:40%;left:80%;animation-delay:3s"></div>
<div class="particle" style="top:80%;left:60%;animation-delay:1s"></div>

<script>
setTimeout(()=>{
document.getElementById("logoSplash").style.opacity="0";
setTimeout(()=>{
document.getElementById("logoSplash").style.display="none";
},1500);
},6000);
</script>

</body>
</html>
